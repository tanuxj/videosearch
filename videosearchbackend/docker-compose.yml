# ─────────────────────────────────────────────────────────────
# VideoSearch backend + Postgres development stack
#
# Usage:
#   docker compose up --build     # build API image + start Postgres
#   docker compose up -d          # run detached
#   docker compose down           # stop (keeps the DB volume)
#   docker compose down -v        # stop and delete the DB volume
#
# The `migrate` service runs `alembic upgrade head` on every `up` and the API
# waits for it to exit 0, so a fresh volume (after `down -v`) is schema-ready
# without a manual step.
#
# Credentials are read from the sibling .env file (POSTGRES_* vars).
# ─────────────────────────────────────────────────────────────

# Shared by the `migrate` and `backend` services so the Alembic run connects
# with exactly the same credentials the API will use.
x-backend-env: &backend_env
  APP_ENV: development
  HOST: 0.0.0.0
  PORT: 3006
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Pass through auth + object storage + edge streaming credentials so
  # the container behaves like the local .env (R2, signed Worker URLs).
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  GUEST_SESSION_MODE: ${GUEST_SESSION_MODE:-per_browser}
  GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-vs_guest}
  GUEST_COOKIE_TTL_DAYS: ${GUEST_COOKIE_TTL_DAYS:-30}
  GUEST_COOKIE_SAMESITE: ${GUEST_COOKIE_SAMESITE:-lax}
  GUEST_COOKIE_SECURE: ${GUEST_COOKIE_SECURE:-false}
  GUEST_COOKIE_DOMAIN: ${GUEST_COOKIE_DOMAIN:-}
  GUEST_USER_NAME: ${GUEST_USER_NAME:-Guest}
  GUEST_USER_EMAIL: ${GUEST_USER_EMAIL:-guest@videosearch.internal}
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-vs_refresh}
  REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
  R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
  R2_REGION: ${R2_REGION:-auto}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  STREAM_WORKER_BASE_URL: ${STREAM_WORKER_BASE_URL:-}
  STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:-}
  # Uploads: hard ceiling per file (bytes). Files above 5 GiB use the
  # presigned multipart flow automatically. Never leave empty ('' breaks
  # pydantic's int parsing and the migrate service aborts).
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10737418240}
  # LLM query expansion (the "middleman"). Empty LLM_API_KEY = raw-prompt search.
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  LLM_EXPAND_PROMPTS: ${LLM_EXPAND_PROMPTS:-2}
  # Semantic-search tuning (passed through so you can tweak without a rebuild).
  # SEARCH_MIN_SIMILARITY empty = per-model default (0.24 CLIP / 0.08 SigLIP 2).
  # Defaults mirror app/core/config.py — never leave the numeric one empty
  # ('' fails pydantic's float/int parsing and the migrate service aborts).
  SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-}
  SEARCH_MERGE_WINDOW_SECONDS: ${SEARCH_MERGE_WINDOW_SECONDS:-2.0}
  # Indexing-pipeline knobs (scene-aware sampling skips near-identical frames,
  # so long static files index far fewer frames). Defaults mirror config.py —
  # never leave these empty ('' fails pydantic's parsing).
  FRAME_INTERVAL_SECONDS: ${FRAME_INTERVAL_SECONDS:-1.0}
  SCENE_AWARE_SAMPLING: ${SCENE_AWARE_SAMPLING:-true}
  SCENE_THRESHOLD: ${SCENE_THRESHOLD:-8.0}
  SCENE_MAX_GAP_SECONDS: ${SCENE_MAX_GAP_SECONDS:-6.0}
  # URL import (paste-a-link): downloads pasted video links with yt-dlp
  # before indexing. Defaults mirror config.py — never leave these empty
  # ('' fails pydantic's parsing).
  URL_IMPORT_ENABLED: ${URL_IMPORT_ENABLED:-true}
  URL_IMPORT_MAX_BYTES: ${URL_IMPORT_MAX_BYTES:-10737418240}
  URL_IMPORT_FORMAT: ${URL_IMPORT_FORMAT:-b[ext=mp4]/b}
  URL_IMPORT_PROBE_TIMEOUT_SECONDS: ${URL_IMPORT_PROBE_TIMEOUT_SECONDS:-30}
  URL_IMPORT_ALLOW_PRIVATE: ${URL_IMPORT_ALLOW_PRIVATE:-false}
  URL_IMPORT_MAX_BATCH: ${URL_IMPORT_MAX_BATCH:-50}
  URL_IMPORT_EXPAND_PLAYLISTS: ${URL_IMPORT_EXPAND_PLAYLISTS:-false}
  # Embedder + Florence-2 captions/grounding. Defaults mirror config.py —
  # never leave EMBEDDING_MODEL empty ('' fails the Literal["clip","siglip2"]
  # validation and the migrate service aborts).
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-clip}
  CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-clip-ViT-B-32}
  # SigLIP 2 checkpoint. patch32-256 is ~3x cheaper per frame than the
  # patch16-224 default; the input resolution is parsed off this id, so
  # nothing else needs changing. Switching it invalidates every stored
  # embedding — re-index afterwards.
  SIGLIP_MODEL_NAME: ${SIGLIP_MODEL_NAME:-google/siglip2-base-patch16-224}
  CLIP_BACKEND: ${CLIP_BACKEND:-onnx}
  # CPU split between the decoder and the embedder — they run concurrently
  # during indexing, so handing either one every core starves the other.
  # EMBED_THREADS empty = cpu_count - 2 (see config.py); never set it to ''
  # with a value in mind, an empty string is what "use the default" means here.
  EMBED_THREADS: ${EMBED_THREADS:-}
  DECODE_THREADS: ${DECODE_THREADS:-2}
  FLORENCE_MODEL_NAME: ${FLORENCE_MODEL_NAME:-microsoft/Florence-2-base}
  CAPTIONS_ENABLED: ${CAPTIONS_ENABLED:-false}
  GROUNDING_ENABLED: ${GROUNDING_ENABLED:-false}
  CAPTION_MIN_SIMILARITY: ${CAPTION_MIN_SIMILARITY:-0.55}
  CAPTION_BATCH_SIZE: ${CAPTION_BATCH_SIZE:-4}
  # Transcription (speech → text). An empty STT_API_KEY disables it entirely
  # and videos report transcript_status="skipped" — so this must be passed
  # through, or the container silently produces no subtitles however the
  # host .env is configured. Never leave the numeric ones empty ('' fails
  # pydantic's parsing and the migrate service aborts).
  STT_API_KEY: ${STT_API_KEY:-}
  STT_BASE_URL: ${STT_BASE_URL:-https://api.groq.com/openai/v1}
  STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
  STT_LANGUAGE: ${STT_LANGUAGE:-}
  STT_CHUNK_SECONDS: ${STT_CHUNK_SECONDS:-600}
  STT_MAX_CONCURRENCY: ${STT_MAX_CONCURRENCY:-4}
  STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-300}
  STT_NO_SPEECH_THRESHOLD: ${STT_NO_SPEECH_THRESHOLD:-0.6}
  # Inside the compose network the DB host is the service name "db".
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-videosearch}
  POSTGRES_USER: ${POSTGRES_USER:-videosearch}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videosearch}
  DATABASE_URL: postgresql://${POSTGRES_USER:-videosearch}:${POSTGRES_PASSWORD:-videosearch}@db:5432/${POSTGRES_DB:-videosearch}

services:
  db:
    # Official pgvector image = Postgres 16 + the `vector` extension.
    # Version pinned for reproducibility (matches project convention).
    image: pgvector/pgvector:0.8.2-pg16
    container_name: videosearch-db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videosearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videosearch}
      POSTGRES_DB: ${POSTGRES_DB:-videosearch}
    ports:
      # Host port comes from POSTGRES_PORT in .env — set it to e.g. 5433
      # if your machine already runs Postgres on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Runs `CREATE EXTENSION IF NOT EXISTS vector;` on first boot only.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-videosearch} -d ${POSTGRES_DB:-videosearch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: brings the schema up to head before the API accepts traffic.
  # Exits 0 when there is nothing to apply, so it is safe on every `up`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videosearch-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videosearch-backend
    restart: unless-stopped
    environment: *backend_env
    volumes:
      # Persist the CLIP weights across rebuilds. Without this they live in the
      # container's writable layer and are re-downloaded (~1.2 GB, several
      # minutes) every time the container is recreated.
      - model_cache:/models
    ports:
      - "${PORT:-3006}:3006"
    depends_on:
      db:
        condition: service_healthy
      # Don't serve requests against a schema that hasn't been upgraded yet.
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  # Survives `down -v`? No — `-v` removes this too. Use plain `down` to keep
  # the weights; `down -v` means paying the download again.
  model_cache:
