[project]
name = "videosearchbackend"
version = "0.1.0"
description = "Production-ready FastAPI backend for VideoSearch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "boto3>=1.35,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "torch>=2.3,<3.0",
    "sentence-transformers>=3.0,<5.0",
    # Headless wheel: the GUI-enabled `opencv-python` needs X11/GTK system
    # libraries that don't exist in the slim Docker image. We only decode
    # frames (VideoCapture) — no GUI — so headless is exactly right.
    "opencv-python-headless>=4.9,<5.0",
]

# torch from the CPU-only wheelhouse: the PyPI default build bundles CUDA,
# which is multi-gigabyte and pointless on a machine without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
videosearch-api = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
